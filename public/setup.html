<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store setup</title>
  <script src="/js/brand.js"></script>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="/css/ui2.css" />
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <main class="card p-4" style="max-width:440px;width:100%">
    <h1 class="h3 mb-1">Welcome</h1>
    <p class="text-muted">Create the owner account for your admin panel.</p>
    <div id="setupMsg" class="alert d-none" role="alert"></div>
    <form id="setupForm" novalidate>
      <div id="suTokenWrap" class="d-none">
        <label class="form-label" for="suToken">Setup token</label>
        <input id="suToken" type="password" class="form-control mb-3" autocomplete="off" />
      </div>
      <label class="form-label" for="suUser">Username</label>
      <input id="suUser" class="form-control mb-3" autocomplete="username" required />
      <label class="form-label" for="suPass">Password (8+ characters)</label>
      <input id="suPass" type="password" class="form-control mb-3" autocomplete="new-password" required />
      <label class="form-label" for="suPass2">Repeat password</label>
      <input id="suPass2" type="password" class="form-control mb-4" autocomplete="new-password" required />
      <button class="btn btn-primary w-100" type="submit">Create owner account</button>
    </form>
  </main>
  <script src="/js/setup.js"></script>
</body>
</html>
