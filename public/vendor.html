<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-brand-title="Seller dashboard">Seller dashboard</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous" />
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/marketplace.css">
  <link rel="stylesheet" href="/css/ui2.css" />
  <script src="/js/brand.js"></script>
  <script src="/js/theme.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand sticky-top navbar-dark" aria-label="Seller">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/"><img src="/img/logo.svg" alt="" class="brand-logo me-2" width="38" height="38"><span class="brand-name" data-brand></span></a>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><span class="nav-link disabled d-none d-sm-inline">Seller dashboard</span></li>
        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-arrow-left me-1"></i>Back to store</a></li>
      </ul>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <!-- Messages: logged out, marketplace off, apply -->
    <div id="vState" class="mx-auto" style="max-width:560px;"></div>

    <div id="vApp" class="d-none">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div>
          <h1 class="h3 mb-1" id="vShopName"></h1>
          <div class="text-muted small"><span id="vStatus" class="badge"></span> <span id="vCommission" class="ms-2"></span> <a id="vShopLink" class="ms-2" href="#" target="_blank" rel="noopener">View my shop page</a></div>
        </div>
      </div>
      <div id="vNotice"></div>

      <div class="row g-3 mb-4" id="vStats"></div>

      <ul class="nav nav-tabs mb-3" id="vTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabProducts" type="button">Products</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabOrders" type="button">Orders</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabEarnings" type="button">Earnings</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabProfile" type="button">Shop details</button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="tabProducts">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Your products</h2>
            <button type="button" class="btn btn-accent btn-sm" id="addProductBtn"><i class="bi bi-plus-lg me-1"></i>Add product</button>
          </div>
          <div id="vProducts"></div>
        </div>
        <div class="tab-pane fade" id="tabOrders"><div id="vOrders"></div></div>
        <div class="tab-pane fade" id="tabEarnings"><div id="vEarnings"></div></div>
        <div class="tab-pane fade" id="tabProfile">
          <form id="profileForm" class="card card-body" style="max-width:560px;" novalidate>
            <div class="mb-3"><label class="form-label fw-semibold" for="pDesc">Shop description</label><textarea class="form-control" id="pDesc" rows="3" maxlength="500"></textarea></div>
            <div class="mb-3"><label class="form-label fw-semibold" for="pPhone">Phone</label><input class="form-control" id="pPhone" maxlength="30"></div>
            <div id="profileMsg" class="small mb-2" aria-live="polite"></div>
            <button type="submit" class="btn btn-ink align-self-start">Save</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <form class="modal-content" id="productForm" novalidate>
        <div class="modal-header mk-modal-head"><h5 class="modal-title" id="productModalTitle">Add product</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label fw-semibold" for="fTitle">Title</label><input class="form-control" id="fTitle" maxlength="200" required></div>
          <div class="mb-3"><label class="form-label fw-semibold" for="fDesc">Description</label><textarea class="form-control" id="fDesc" rows="3" maxlength="1000"></textarea></div>
          <div class="row g-3 mb-3">
            <div class="col-6"><label class="form-label fw-semibold" for="fCategory">Category</label><select class="form-select" id="fCategory"></select></div>
            <div class="col-6"><label class="form-label fw-semibold" for="fPrice">Price</label><input class="form-control" id="fPrice" inputmode="decimal" placeholder="999.00"></div>
            <div class="col-6"><label class="form-label fw-semibold" for="fStock">Stock</label><input class="form-control" id="fStock" inputmode="numeric" placeholder="10"></div>
            <div class="col-6"><label class="form-label fw-semibold" for="fImage">Picture</label><input class="form-control" id="fImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div>
          </div>
          <div id="fSizeGrid" class="mb-3"></div>
          <div id="fGallery"></div>
          <div class="small text-muted" id="fImageHint">PNG, JPG, WebP or GIF, up to 2 MB.</div>
          <div id="productMsg" class="small mt-2" aria-live="polite"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-accent" id="productSave">Save</button></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <footer class="container py-4 small text-muted text-center mk-legal-links"><a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a> &middot; <a href="/returns.html">Returns &amp; refunds</a> &middot; <a href="/shipping.html">Shipping</a> &middot; <a href="/faq.html">FAQ</a> &middot; <a href="/contact.html">Contact</a></footer>
  <script src="/js/size-grid.js"></script>
  <script src="/js/gallery-editor.js"></script>
  <script src="/js/vendor.js"></script>
  <script src="/js/motion-core.js" defer></script>
  <script src="/js/motion.js" defer></script>
  <script src="/js/i18n.js" defer></script>
</body>
</html>
