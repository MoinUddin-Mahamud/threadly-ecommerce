<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-brand-title="Payment Successful">Payment Successful</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/marketplace.css" />
  <link rel="stylesheet" href="/css/payment.css" />
  <link rel="stylesheet" href="/css/ui2.css" />
  <script src="/js/brand.js"></script>
  <script src="/js/theme.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top" aria-label="Main">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="/img/logo.svg" alt="" class="brand-logo me-2" width="38" height="38">
        <span class="brand-name" data-brand></span>
      </a>
      <a class="btn btn-sm btn-outline-light ms-auto" href="/"><i class="bi bi-arrow-left me-1"></i>Back to shop</a>
    </div>
  </nav>

  <main class="container pay-page py-5">
    <div class="row justify-content-center w-100 mx-0">
      <div class="col-md-6 col-lg-5">
        <div class="card pay-card shadow-lg p-5 text-center">
          <div class="pay-icon pay-icon-ok" role="img" aria-labelledby="heading">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </div>
          <h2 class="fw-bold mb-2 pay-heading" id="heading">Payment Successful!</h2>
          <p class="text-muted mb-3" id="message">Your order has been confirmed. A confirmation email has been sent to you.</p>
          <div id="orderDetails" class="pay-details p-3 mb-4 text-start">
            <div class="d-flex justify-content-between mb-1">
              <span class="text-muted small">Transaction ID</span>
              <strong class="small" id="tranId">-</strong>
            </div>
            <div class="d-flex justify-content-between">
              <span class="text-muted small" id="amountLabel">Amount Paid</span>
              <strong class="small pay-amount" id="amountPaid">-</strong>
            </div>
          </div>
          <!-- Manual payment: how to pay, and a form for the payment reference -->
          <div id="manualBox" class="text-start mb-4 d-none">
            <div class="alert alert-warning small" id="manualInstructions"></div>
            <form id="referenceForm" class="d-flex gap-2">
              <input type="text" class="form-control" id="paymentReference" maxlength="60" placeholder="Payment reference / transaction number" required />
              <button type="submit" class="btn btn-dark text-nowrap">Send</button>
            </form>
            <div id="referenceMsg" class="small mt-2" aria-live="polite"></div>
          </div>
          <a href="/" class="btn btn-lg fw-semibold w-100 pay-cta">
            <i class="bi bi-bag me-2"></i>Continue Shopping
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="mk-footer">
    <div class="container">
      <div class="mk-footer-bottom">
        <span>&copy; <span id="footerYear">2026</span> <span data-brand></span>. All rights reserved.</span>
        <span class="mk-legal-links"><a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a> &middot; <a href="/returns.html">Returns &amp; refunds</a> &middot; <a href="/shipping.html">Shipping</a> &middot; <a href="/faq.html">FAQ</a> &middot; <a href="/contact.html">Contact</a></span>
      </div>
    </div>
  </footer>
  <script src="/js/legal.js"></script>
  <script src="/js/payment-success.js"></script>
  <script src="/js/motion-core.js" defer></script>
  <script src="/js/motion.js" defer></script>
  <script src="/js/i18n.js" defer></script>
</body>
</html>
