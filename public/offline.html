<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>You are offline</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f1f3d; color: #f6f7fb; text-align: center; padding: 1.5rem; }
    main { max-width: 26rem; }
    img { width: 72px; height: 72px; border-radius: 50%; }
    h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
    p { margin: 0 0 1.25rem; color: #c9d2e3; }
    a { display: inline-block; padding: .6rem 1.2rem; border-radius: .4rem; background: #e0a92e; color: #0f1f3d; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/img/logo.svg" alt="" width="72" height="72" />
    <h1>You are offline</h1>
    <p>The store needs an internet connection to show products and take orders. Check your connection and try again.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
